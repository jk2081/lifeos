# Runs on every pull request and every push to main: the full unit suite on a fresh Frappe 16 bench, the scan with
# Frappe's semgrep rules over the whole app, and the acceptance walk (tools/acceptance.mjs) at 1440 px and 390 px, one job per place.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]   # labeled: adding `quick` re-plans the walk
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"   # 03:00 in Kolkata: the full walk on main every night, whatever quick pull requests skipped

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which places the acceptance walk covers. Every place, except on a pull request labelled `quick` whose description has a line
  # `Walk: brain,library`: then only those (a small fix, tested where it changed; the nightly run walks everything).
  plan:
    name: Plan the walk
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        env:
          BODY: ${{ github.event.pull_request.body }}
          QUICK: ${{ contains(github.event.pull_request.labels.*.name, 'quick') }}
        run: |
          all='["today","brain","goals","library","review","settings","phone","tooling"]'
          parts="$all"
          if [ "$QUICK" = "true" ]; then
            walk=$(printf '%s\n' "$BODY" | sed -n 's/^Walk: *//p' | head -1 | tr -d ' \r')
            if [ -n "$walk" ]; then
              parts=$(jq -cn --arg w "$walk" --argjson all "$all" '[$w | split(",")[] | select(. as $p | $all | index($p))] | unique')
              [ "$parts" = "[]" ] && parts="$all"
            fi
          fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "Walking: $parts"

  scan:
    name: Scan (Frappe semgrep rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # the same commit as tools/scan.sh
      RULES_REF: 81a6e3d47a328249e8ddf04c586e493dd5553002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        run: |
          pip install -q semgrep
          git clone -q https://github.com/frappe/semgrep-rules /tmp/frappe-semgrep-rules
          git -C /tmp/frappe-semgrep-rules checkout -q "$RULES_REF"
          semgrep scan --metrics=off --quiet --json --config /tmp/frappe-semgrep-rules/rules lifeos > /tmp/scan.json || true
          python3 tools/scan_summary.py < /tmp/scan.json

  tests:
    name: Unit tests (Frappe 16)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7-alpine
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pip and yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/yarn
          key: deps-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'frontend/yarn.lock', 'frontend/package.json') }}

      - name: Bench
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client libmariadb-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-ben ocrmypdf ffmpeg >/dev/null  # issue 104: the tools that read files on the server
          npm install -g yarn >/dev/null
          pip install -q frappe-bench
          # the Frappe release Life OS is tested on (Flow ships from v16.60, issue 108)
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch v16.61.0 ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Life OS
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app lifeos "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password "$(openssl rand -hex 16)" --mariadb-user-host-login-scope='%' test_site
          bench --site test_site install-app lifeos
          bench --site test_site set-config allow_tests true

      - name: Unit tests
        working-directory: /home/runner/frappe-bench
        env:
          # the load test's 500 ms timings are checked on the Docker bench; shared runners vary too much (test_m9_load.py)
          LIFEOS_SKIP_TIMINGS: "1"
        run: bench --site test_site run-tests --app lifeos

  acceptance:
    name: Acceptance walk (${{ matrix.part }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # the walk, one job per place side by side, each on its own bench (`--part=` in tools/acceptance.mjs; the checks of a place
        # are in tools/acceptance/<place>.mjs). `tooling` checks the setup switches and this workflow.
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    defaults:
      run:
        # bash with pipefail, so a failed walk fails its step through `tee`
        shell: bash
    services:
      redis-cache:
        image: redis:7-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7-alpine
        ports: ["11000:6379"]
    env:
      # the switches of tools/bench.sh and tools/acceptance-env.mjs: a bench folder here instead of the Mac's Docker bench
      LIFEOS_BENCH_CMD: local
      LIFEOS_BENCH_PATH: /home/runner/frappe-bench
      LIFEOS_FAIL_SHOTS: /tmp/acceptance-artifact/screenshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pip, yarn and Playwright's browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/yarn
            ~/.cache/ms-playwright
          key: acceptance-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'frontend/yarn.lock', 'frontend/package.json', 'tools/package-lock.json') }}
          restore-keys: acceptance-${{ runner.os }}-

      - name: Passwords for this run
        # made here, masked in the log and kept only in this job's environment
        run: |
          for name in LIFEOS_DEV_PASSWORD LIFEOS_DB_ROOT_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Database
        # started here rather than as a service, so its root password is the one made above
        run: |
          MARIADB_ROOT_PASSWORD="$LIFEOS_DB_ROOT_PASSWORD" docker run -d --name lifeos-ci-db -e MARIADB_ROOT_PASSWORD \
            -p 3306:3306 mariadb:11.8 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci \
            --skip-character-set-client-handshake >/dev/null
          for i in $(seq 1 60); do
            docker exec lifeos-ci-db healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "MariaDB did not start"; exit 1

      - name: Bench
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client libmariadb-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-ben ocrmypdf ffmpeg >/dev/null  # issue 104: the tools that read files on the server
          npm install -g yarn >/dev/null
          pip install -q frappe-bench
          pipx install semgrep >/dev/null
          # the Frappe release Life OS is tested on (Flow ships from v16.60, issue 108), with its own assets built (the desk and login pages)
          bench init --skip-redis-config-generation --python "$(which python)" --frappe-branch v16.61.0 "$LIFEOS_BENCH_PATH"
          # as on the Docker bench
          cd "$LIFEOS_BENCH_PATH" && bench set-config -g developer_mode 1

      - name: Install Life OS and build the front end
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app --skip-assets lifeos "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench build --app lifeos
          # the owner's test site: the walk's last checks look for debris there (END.2)
          bench new-site --db-root-password "$LIFEOS_DB_ROOT_PASSWORD" --admin-password "$(openssl rand -hex 16)" \
            --mariadb-user-host-login-scope='%' --install-app lifeos lifeos.localhost

      - name: Browser
        run: |
          npm ci --prefix tools --no-audit --no-fund
          (cd tools && npx playwright-core install --with-deps chromium)

      - name: Acceptance site
        run: scripts/acceptance-site.sh --new

      - name: Acceptance walk
        run: |
          mkdir -p /tmp/acceptance-artifact
          node tools/acceptance.mjs --no-reset --part=${{ matrix.part }} 2>&1 | tee /tmp/acceptance-artifact/walk.log

      - name: Collect screenshots and logs
        if: failure()
        run: |
          mkdir -p /tmp/acceptance-artifact/logs
          cp /tmp/acc-site.log /tmp/serve-acceptance.log /tmp/worker-acceptance.log /tmp/acceptance-artifact/logs/ 2>/dev/null || true
          cp -r "$LIFEOS_BENCH_PATH/logs" /tmp/acceptance-artifact/logs/bench 2>/dev/null || true
          # bench.log records each bench command with its arguments, passwords included
          rm -f /tmp/acceptance-artifact/logs/bench/bench.log*
          # nothing secret leaves the runner (issue 5, acceptance test 4)
          if grep -rlF -e "$LIFEOS_DEV_PASSWORD" -e "$LIFEOS_DB_ROOT_PASSWORD" /tmp/acceptance-artifact; then
            echo "a password is in the files above; nothing is uploaded"
            rm -rf /tmp/acceptance-artifact
            exit 1
          fi

      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/acceptance-artifact
          if-no-files-found: ignore
          retention-days: 14
