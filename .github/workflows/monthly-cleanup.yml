# The light re-run of the cleanup guards, on the 1st of every month: the guards in report mode, jscpd and vulture (tools/monthly-cleanup.mjs).
# It opens ONE issue "Monthly cleanup check: <month>", labelled `audit` (never `ready`), and nothing when there are no findings.
name: Monthly cleanup check

on:
  schedule:
    - cron: "30 3 1 * *"   # 09:00 in Kolkata on the 1st
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Cleanup check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install -q vulture
      - name: Check and open the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/monthly-cleanup.mjs
