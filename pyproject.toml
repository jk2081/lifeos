[project]
name = "lifeos"
authors = [{ name = "Jai Kejriwal" }]
description = "Life OS: a personal operating system on Frappe"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
dynamic = ["version"]
dependencies = ["anthropic==2.9.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
