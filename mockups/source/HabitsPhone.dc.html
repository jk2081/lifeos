<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habits on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0062B3}a:hover{color:#004F91}
.ph{width:390px;height:844px;box-sizing:border-box;background:#fff;color:#171717;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
.cd{border:1px solid #EDEDED;border-radius:12px;padding:12px 14px}
.sh{font-size:13px;font-weight:600;color:#525252;margin:0 0 6px}
.mt{font-size:12.5px;color:#6B6B6B}
.tb{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid #EDEDED;overflow:hidden;white-space:nowrap}
.tb a{padding:10px 0 11px;color:#525252;text-decoration:none;border-bottom:2px solid transparent;font-size:14px}
.tb a.on{color:#171717;font-weight:600;border-bottom-color:#171717}
.ch{height:36px;padding:0 14px;border-radius:9px;border:1px solid #E2E2E2;background:#fff;color:#383838;font:500 14px Inter,system-ui,sans-serif}
.ch.on{background:#171717;border-color:#171717;color:#fff}
.dy{height:44px;border-radius:10px;border:1px solid #E2E2E2;background:#fff;color:#171717;font:500 14px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:0}
.dy.d{background:#171717;border-color:#171717;color:#fff}
.dy.m{background:#F3F3F3;border-color:#F3F3F3;color:#6B6B6B}
.dy.t{border:2px solid #0062B3;color:#0062B3;font-weight:700}
.dy.f{color:#6B6B6B}
.br{height:6px;border-radius:3px;background:#EDEDED;overflow:hidden;flex-grow:1}
.br i{display:block;height:6px;background:#171717}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11.5px;color:#525252;text-decoration:none}
.tab.on{color:#171717;font-weight:600}
</style>
</helmet>
<div class="ph">
  <header style="padding: 18px 16px 8px; display: flex; align-items: center; gap: 10px;">
    <div style="flex-grow: 1;">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Journal</h1>
      <div class="mt">November 2026</div>
    </div>
    <button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #F3F3F3; color: #171717; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
    <button type="button" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #F3F3F3; color: #171717; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
  </header>
  <nav class="tb" aria-label="Journal sections">
    <a href="#">12 Weeks</a><a href="#">Month</a><a class="on" href="#">Habits</a><a href="#">Check-ins</a><a href="#">Pages</a>
  </nav>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; gap: 8px;">
      <button class="ch on" type="button">Japa</button><button class="ch" type="button">Mala</button><button class="ch" type="button">Journal</button><button class="ch" type="button">Workout</button>
    </div>

    <section>
      <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600; flex-grow: 1;">Japa</h2>
        <span style="font-weight: 600; font-variant-numeric: tabular-nums;">12 of 14 days</span><span class="mt">86%</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="30"><button class="{{d.cls}}" type="button" aria-label="{{d.al}}">{{d.n}}</button></sc-for>
      </div>
      <div class="mt" style="margin-top: 8px;">Seven boxes a row, as in the paper journal. Tap a box to change it.</div>
    </section>

    <section>
      <h2 class="sh">This month so far</h2>
      <div class="cd" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 68px; flex: none;">Japa</span><div class="br"><i style="width: 86%;"></i></div><span style="width: 44px; text-align: right; font-variant-numeric: tabular-nums;">12/14</span></div>
        <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 68px; flex: none;">Mala</span><div class="br"><i style="width: 71%;"></i></div><span style="width: 44px; text-align: right; font-variant-numeric: tabular-nums;">10/14</span></div>
        <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 68px; flex: none;">Journal</span><div class="br"><i style="width: 50%;"></i></div><span style="width: 44px; text-align: right; font-variant-numeric: tabular-nums;">7/14</span></div>
        <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 68px; flex: none;">Workout</span><div class="br"><i style="width: 43%;"></i></div><span style="width: 44px; text-align: right; font-variant-numeric: tabular-nums;">6/14</span></div>
      </div>
      <div class="mt" style="margin-top: 8px;">Example data.</div>
    </section>
  </div>

  <nav aria-label="Sections" style="display: flex; border-top: 1px solid #EDEDED; background: #FCFCFC;">
    <a class="tab" href="TodayPhone.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Today</a>
    <a class="tab" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2-8h12l2 8v6H4zM4 13h5l1 3h4l1-3h5"></path></svg>Inbox</a>
    <a class="tab" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Tasks</a>
    <a class="tab on" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6zM10 3v18"></path></svg>Journal</a>
    <a class="tab" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"></path></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const missed = [4, 10];
    const today = 14;
    const days = [];
    for (let n = 1; n <= 30; n += 1) {
      let cls = 'dy f';
      let state = 'upcoming';
      if (n === today) { cls = 'dy t'; state = 'today, not ticked yet'; }
      else if (n < today && missed.indexOf(n) >= 0) { cls = 'dy m'; state = 'missed'; }
      else if (n < today) { cls = 'dy d'; state = 'done'; }
      days.push({ n, cls, al: n + ' November, ' + state });
    }
    return { days };
  }
}
</script>
</body>
</html>
