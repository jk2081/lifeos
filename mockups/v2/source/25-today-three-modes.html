<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Today: three modes, Overview (work), Goals (planning), Calendar (time)</title>
<!-- Open with #overview or #goals: the four views stacked in that mode. Calendar is unchanged: see 24-today-overview-calendar.html#calendar. Day Overview uses the owner's real tasks of 27 Nov 2026; goal names and week/month/year counts are examples. -->
<style>
:root{--t:#171717;--t2:#6B6B6B;--t3:#8A8A8A;--b:#EDEDED;--b2:#DADADA;--b3:#A3A3A3;--bg:#F3F3F3;--s:#fff;--page:#FAFAFA;--ac:#0062B3;--acbg:#E6F4FF;--wa:#A8480A;--dabg:#FDECEC;--da:#B42318}
*{box-sizing:border-box}body{margin:0;padding:28px;font-family:Inter,system-ui,sans-serif;color:var(--t);background:var(--page);font-size:14px;width:1440px}
.lab{font-size:13px;color:var(--t3);margin:24px 0 8px}
.fr{border:1px solid var(--b);border-radius:14px;background:var(--s);padding:18px 22px 22px}
.hd{display:flex;justify-content:space-between;margin-bottom:12px}.t{font-size:20px;font-weight:600;margin:0}.st{font-size:13px;color:var(--t2);margin:3px 0 0}
.row1{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b);margin-bottom:14px}
.tabs span{display:inline-block;padding:8px 12px;color:var(--t2);border-bottom:2px solid transparent}.tabs span.on{color:var(--t);border-bottom-color:var(--t)}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:5px}.seg span{padding:5px 14px;border-radius:6px;color:var(--t2);font-size:13px}.seg span.on{background:var(--s);color:var(--t);font-weight:500}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.m{background:var(--bg);border-radius:10px;padding:12px 14px}.l{font-size:13px;color:var(--t2);margin:0}.n{font-size:24px;font-weight:600;margin:2px 0}.s{font-size:12px;color:var(--t3);margin:0}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.c{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px 16px}.h{font-size:14px;font-weight:600;margin:0 0 6px}
.rw{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--b);font-size:13px}
.mu{color:var(--t2)}.wa{color:var(--wa)}.ac{color:var(--ac)}
.r{display:flex;align-items:flex-end;height:30px}.r>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.r .tk{width:1px;height:6px;background:var(--b3)}.r .p .tk{background:var(--b2)}.r .lb{font-size:12px;color:var(--t2);margin-bottom:3px;white-space:nowrap}
.r .nb .tk{height:9px}.r .now .tk{width:2px;height:13px;background:var(--ac);border-radius:1px}.r .now .lb{color:var(--ac);font-weight:600}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.wk>div{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:8px;min-height:130px;font-size:12px}
.wk .td{border-color:var(--ac)}.wk .td>div:first-child{color:var(--ac);font-weight:600}
.ev{background:var(--bg);border-radius:5px;padding:3px 6px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.due{background:var(--dabg);color:var(--da)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--b);border-radius:10px;overflow:hidden}
.mg>div{border-right:1px solid var(--b);border-bottom:1px solid var(--b);padding:6px 8px;min-height:72px;font-size:12px}.mg .hdr{min-height:0;color:var(--t2);background:var(--bg)}
.mg .out{color:var(--t3)}.mg .tdy{background:var(--acbg)}.mg .tdy>b{color:var(--ac)}
.yg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.yg>div{border:1px solid var(--b);border-radius:10px;padding:8px 10px;min-height:86px;font-size:12px}
.yg .cur{border-color:var(--ac)}.yg .cur>b{color:var(--ac)}.dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--da);margin-right:5px}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:var(--ac)}.box{flex:none;width:14px;height:14px;border:1px solid var(--b3);border-radius:3px;margin-right:8px}.ok{color:#2E7D32}.rw .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div id="root"></div>
<script>
const card=(l,n,s,k)=>`<div class="m"><p class="l">${l}</p><p class="n">${n}</p><p class="s ${k||''}">${s}</p></div>`;
const rows=a=>a.map(r=>`<div class="rw" style="align-items:center">${r[2]=='box'?'<i class="box"></i>':''}<span class="tt">${r[0]}</span><span class="${r[3]||'mu'}">${r[1]}</span></div>`).join('');
const pnl=(h,b)=>`<div class="c"><p class="h">${h}</p>${b}</div>`;
const bars=a=>a.map(r=>`<div style="margin:8px 0;font-size:13px"><div style="display:flex;justify-content:space-between"><span>${r[0]}</span><span class="${r[3]||'mu'}">${r[1]}</span></div><div class="bar"><i style="width:${r[2]}%;${r[3]=='wa'?'background:var(--wa)':''}"></i></div></div>`).join('');
const PLATE=rows([['Follow up with Anirudh Poddar on his ERP proposal (SAP B1 blueprint)','Career','box'],['Follow up with Ravi on the UnstoppableOS trademark filing','Career','box'],['Follow up with Shubhangi on next steps for the IIFM membership','Career','box'],['Clean Cert (Ritika Kumar): pay two final consultancy invoices','Money','box'],['Subhangee: Monday 4 pm demo of the SAP B1 proof of concept','Career','box']]);
const WAIT=rows([['Ekta Jalan · confirm 1 Dec','late','','wa'],['Prerna and Anindita · stock ageing review','Mon'],['Vivek · ITR draft','Fri']]);
const ACTIVE=rows([['Business That Works','4 tasks · 3 emails'],['Ruchi ITR','2 tasks · 1 meeting'],['Anirudh Poddar','1 task · 2 emails']]);
const V={
Day:{t:'Friday, 27 November',s:'2 days left this week · 1 meeting',
 overview:()=>`<div class="g4">${card('Due today','5','2 more this week')}${card('Needs you','1','oldest 1 day')}${card('Check today','0','3 waiting, none due')}${card('Done today','0','2 yesterday')}</div><div class="two">${pnl('Your plate',PLATE)}${pnl('Needs you',rows([['Await Chandighat tea stock ageing review','Task']]))}</div>`,
 goals:()=>`<div class="g4">${card('Top three','1 of 3','done today')}${card('Habits','2 of 3','today')}${card('Week score','62%','so far · target 85%')}${card('Goal work today','45 min','planned')}</div><div class="two">${pnl('Top three',rows([['Close the Mehi Motors proposal','done','box','ok'],['Ghillidary drainage plan to Mr Rao','Rungamattee','box'],['Book the Ruchi ITR filing','Family','box']]))}${pnl('Habits',rows([['Meditation','done','','ok'],['Workout','done','','ok'],['Read 20 min','not yet']]))}</div>`},
Week:{t:'23 – 29 November',s:'Week 7 of 12',
 overview:()=>`<div class="g4">${card('Done this week','4','7 still due')}${card('Needs you','1','oldest 1 day')}${card('Waiting on others','3','1 late','wa')}${card('Brain filed alone','43%','3 of 7')}</div><div class="two">${pnl('Most active this week',ACTIVE)}${pnl('Waiting on others',WAIT)}</div>`,
 goals:()=>`<div class="g4">${card('Week score','71%','target 85% · last 64%')}${card('Top three','1 of 3','done')}${card('Goals on track','3 of 4','1 behind','wa')}${card('Habits','14 of 21','ticks')}</div><div class="two">${pnl('Goals by area',bars([['BTW · 5 founding customers','2 of 5',40],['Rungamattee · Ghillidary yield','on track',62],['Family · Ruchi ITR filed','due 15 Dec',30,'wa']]))}${pnl("This week's goal work",rows([['Mehi Motors proposal','done','','ok'],['Drainage plan','Sat'],['ITR papers to Vivek','Mon']]))}</div>`},
Month:{t:'November 2026',s:'49 meetings · 5 due dates',
 overview:()=>`<div class="g4">${card('Done this month','23','18 still open')}${card('Needs you','1','oldest 1 day')}${card('Waiting on others','3','1 late','wa')}${card('Brain filed alone','43%','3 of 7')}</div><div class="two">${pnl('Most active this month',ACTIVE)}${pnl('Waiting on others',WAIT)}</div>`,
 goals:()=>`<div class="g4">${card('Month score','68%','4 weeks')}${card('Month plan','3 of 5','outcomes met')}${card('Goals due','2','1 behind','wa')}${card('Reviews locked','3 of 4','weeks')}</div><div class="two">${pnl('Weeks of the month',bars([['Week of 2 Nov','64%',64],['Week of 9 Nov','70%',70],['Week of 16 Nov','66%',66],['Week of 23 Nov · now','71%',71]]))}${pnl('Goals due',rows([['Ruchi ITR filed','15 Dec','','wa'],['2 BTW customers signed','30 Nov']]))}</div>`},
Year:{t:'2026',s:'35 days left',
 overview:()=>`<div class="g4">${card('Done this year','212','tasks')}${card('Came in','1,340','captured and filed')}${card('People','86','with pages')}${card('Brain filed alone','43%','in November')}</div><div class="two">${pnl('Most active this year',rows([['Business That Works','140 items'],['Rungamattee','96 items'],['CIS','41 items']]))}${pnl('By month',rows([['November','23 done'],['October','31 done'],['September','28 done']]))}</div>`,
 goals:()=>`<div class="g4">${card('Year goals','4 of 9','met')}${card('This cycle','71%','week 7 of 12')}${card('Reviews locked','38 of 47','weeks')}${card('Habits','81%','kept')}</div><div class="two">${pnl('Year goals by area',bars([['BTW · revenue target','71%',71],['Rungamattee · yield per hectare','64%',64],['Health · fitness test','behind',40,'wa']]))}${pnl('Cycles',rows([['Cycle 3 · Jul to Sep','79%'],['<span class="ac">Cycle 4 · now</span>','71%','','ac']]))}</div>`}};
const mode=(location.hash.slice(1)||'overview')=='goals'?'goals':'overview';
document.getElementById('root').innerHTML=['Day','Week','Month','Year'].map(k=>{const v=V[k];return `<p class="lab">${k} · ${mode=='goals'?'Goals':'Overview'}</p><div class="fr"><div class="hd"><div><p class="t">${v.t}</p><p class="st">${v.s}</p></div><div class="mu">‹ Today ›</div></div><div class="row1"><div class="tabs">${['Day','Week','Month','Year'].map(t=>`<span class="${t==k?'on':''}">${t}</span>`).join('')}</div><div class="seg">${['Overview','Goals','Calendar'].map(t=>`<span class="${t.toLowerCase()==mode?'on':''}">${t}</span>`).join('')}</div></div>${v[mode]()}</div>`}).join('');
</script></body></html>
